name: terraform-docs

on:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      # No explicit ref: the default checkout for a pull_request event is the merge
      # commit. Pinning head.ref resolves against the BASE repo, so a fork PR either
      # fails outright or — when the fork's branch is also named main — silently
      # checks out base main and passes without testing the contribution at all.
      - uses: actions/checkout@v4

      - name: Verify README.md matches terraform-docs output
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: .
          config-file: .terraform-docs.yml
          output-file: README.md
          output-method: inject
          fail-on-diff: "true"
          git-push: "false"
